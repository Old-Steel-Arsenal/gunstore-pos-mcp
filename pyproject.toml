[project]
name = "gunstore-mcp"
dynamic = ["version"]
description = "MCP server wrapping the GunStore-POS Frappe REST API"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.27,<2",  # code targets the v1 FastMCP API; mcp 2.x renamed it to MCPServer,
    "requests>=2.31",
    "urllib3>=2",
    "python-dotenv>=1.0",
]

[project.scripts]
gunstore-mcp = "gunstore_mcp.server:main"

[tool.hatch.version]
path = "gunstore_mcp/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gunstore_mcp"]
